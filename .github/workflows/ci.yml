name: CI

# Pull requests: tests only, once per change (no separate branch-push run).
# main: tests, then the Docker image build and smoke test.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its run in progress; main runs to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # ffmpeg and libheif are exercised by the server tests
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libheif-examples libheif-plugin-libde265
      - run: npm ci
      - run: npm run check
      - run: npm run build

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t photo-planet .
      - name: Smoke test
        run: |
          docker run -d --name pp -p 8080:3000 photo-planet
          for i in $(seq 1 20); do curl -fs localhost:8080/api/health && exit 0; sleep 1; done
          docker logs pp; exit 1
