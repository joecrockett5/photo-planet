name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libheif-examples
      - run: npm ci
      - run: npm run check
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t photo-planet .
      - name: Smoke test
        run: |
          docker run -d --name pp -p 8080:3000 photo-planet
          for i in $(seq 1 20); do curl -fs localhost:8080/api/health && exit 0; sleep 1; done
          docker logs pp; exit 1
