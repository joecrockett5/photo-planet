name: Release

# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to:
#  1. run the tests,
#  2. build the image for linux/amd64 and linux/arm64 and push it to
#     ghcr.io/<owner>/photo-planet as :1.0.0, :1.0, :1 and :latest,
#  3. smoke-test the published image,
#  4. publish a GitHub Release with that version's notes from CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub Release
  packages: write # push to ghcr.io

concurrency:
  group: release-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libheif-examples libheif-plugin-libde265
      - run: npm ci
      - run: npm run check

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # :latest follows the newest non-prerelease tag
          flavor: latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker run -d --name pp -p 8080:3000 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fs localhost:8080/api/health | tee /dev/stderr | grep -q "\"version\":\"$VERSION\""; then exit 0; fi
            sleep 1
          done
          docker logs pp; exit 1

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          # the section under "## [VERSION]", up to the next section or the link list
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && (/^## \[/ || /^\[[^]]*\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Run it"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
            echo '```'
          } >> notes.md
          cat notes.md
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --title "Photo Planet $TAG" --notes-file notes.md --verify-tag $prerelease
